[pytest]
# ── Root ──────────────────────────────────────────────
# pytest.ini — project-level pytest configuration

# Discover tests from the tests/ directory
testpaths = tests

# Log format for captured logs
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Shorter traceback style
addopts = --tb=short -q

# Treat these warnings as errors to keep code clean
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*

